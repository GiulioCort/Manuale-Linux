        <main>
            <h1>Comando touch</h1>
            <p>Il comando <code>touch</code> permette di creare un nuovo file vuoto.</p>
            <h2>Utilizzi</h2>
            <p>
                <code>touch fileEsempio.txt</code>
                crea un nuovo file di testo vuoto.
            </p>
            <p>
                <code>touch .fileEsempio.txt</code>
                crea un nuovo file vuoto e nascosto (il . davanti).
            </p>
        </main>
    </section>
</body>
